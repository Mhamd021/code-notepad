services:
  postgres:
    image: postgres:16
    container_name: notepad_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: code_notepad
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: notepad_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  pgdata: